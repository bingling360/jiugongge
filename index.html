<script>
    (function () {
        var startImageBackgroundDiv = document.getElementById('startImageBackgroundDiv');
        var startImageLogo = document.getElementById('startImageLogo');
        var startImageDiv = document.getElementById('startImageDiv');
        startImageLogo.onload = function () {
            startImageBackgroundDiv.style.display = 'block';
            var onAnimationEnd = function () {
                startImageBackgroundDiv.style.display = 'none';
                startImageLogo.classList.remove("startImageAnimation");
                startImageDiv.classList.remove("startImageDivAnimation");
            }
            startImageDiv.addEventListener("webkitAnimationEnd", onAnimationEnd);
            startImageDiv.addEventListener("animationend", onAnimationEnd);
            startImageLogo.classList.add("startImageAnimation");
            startImageDiv.classList.add("startImageDivAnimation");
            // 注释下面这句话以禁止单击立刻跳过开场动画
            startImageBackgroundDiv.onclick = onAnimationEnd;
        }
        startImageLogo.onerror = function () {}
        startImageLogo.src = "logo.png";
    })();
</script>

<!-- 竖屏下点底部"虚拟键盘"图标，在底部中间唤出方向键面板（默认隐藏，仅点图标时出现） -->
<div id="dpadPanel" aria-hidden="true">
    <div class="dpad-btn" data-code="37" id="dpad-left">◀</div>
    <div class="dpad-btn" data-code="38" id="dpad-up">▲</div>
    <div class="dpad-btn" data-code="40" id="dpad-down">▼</div>
    <div class="dpad-btn" data-code="39" id="dpad-right">▶</div>
</div>
<script>
(function () {
  function setupDpad() {
    var dpad = document.getElementById('dpadPanel');
    var kb = document.getElementById('img-keyboard');
    if (!dpad || !kb) return;

    var active = {};
    function press(code) {
      if (active[code]) return;
      active[code] = true;
      if (window.core && window.core.onkeyDown) window.core.onkeyDown({ keyCode: code });
    }
    function release(code) {
      if (!active[code]) return;
      active[code] = false;
      if (window.core && window.core.onkeyUp) window.core.onkeyUp({ keyCode: code });
    }
    function releaseAll() {
      Object.keys(active).forEach(function (c) {
        if (active[c]) {
          var btn = dpad.querySelector('.dpad-btn[data-code="' + c + '"]');
          if (btn) btn.classList.remove('pressed');
          release(parseInt(c, 10));
        }
      });
    }

    dpad.querySelectorAll('.dpad-btn').forEach(function (btn) {
      var code = parseInt(btn.getAttribute('data-code'), 10);
      btn.addEventListener('pointerdown', function (e) {
        e.preventDefault();
        e.stopPropagation();
        btn.classList.add('pressed');
        press(code);
      });
      ['pointerup', 'pointercancel'].forEach(function (ev) {
        btn.addEventListener(ev, function (e) {
          e.preventDefault();
          e.stopPropagation();
          btn.classList.remove('pressed');
          release(code);
        });
      });
    });

    window.addEventListener('pointerup', releaseAll, true);
    window.addEventListener('pointercancel', releaseAll, true);

    var dpadHidden = true;
    function isVert() {
      return !!(window.core && window.core.domStyle && window.core.domStyle.isVertical);
    }
    function isPlaying() {
      return !!(window.core && window.core.isPlaying && window.core.isPlaying());
    }
    function apply() {
      dpad.style.display = (isVert() && isPlaying() && !dpadHidden) ? 'flex' : 'none';
    }

    var origOnClick = kb.onclick;
    kb.onclick = function (e) {
      if (isVert()) {
        if (e && e.preventDefault) { e.preventDefault(); e.stopPropagation(); }
        dpadHidden = !dpadHidden;
        apply();
        return;
      }
      if (origOnClick) origOnClick.call(kb, e);
      else if (window.core && window.core.openKeyBoard) window.core.openKeyBoard(true);
    };

    // 面板打开时，点按除方向键（及虚拟键盘图标）以外的任意位置均可关闭
    document.addEventListener('click', function (e) {
      if (dpadHidden) return;
      if (e.target && e.target.closest && (e.target.closest('.dpad-btn') || e.target.closest('#img-keyboard'))) return;
      dpadHidden = true;
      apply();
    }, false);

    if (window.core && window.core.control && window.core.control.registerResize) {
      window.core.control.registerResize('dpadPanel', function () { apply(); });
    }
    window.addEventListener('resize', apply);
    apply();
    setTimeout(apply, 300);

    var lastKey = '';
    setInterval(function () {
      var key = (isVert() ? 'V' : 'H') + '|' + (isPlaying() ? 'P' : 'N') + '|' + (dpadHidden ? 'H' : 'S');
      if (key !== lastKey) { lastKey = key; apply(); }
    }, 400);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', setupDpad);
  } else {
    setupDpad();
  }
})();
</script>

<!-- 开场剧情演出层：在玩家点击"开始游戏"后弹出，三段对话 + 角色立绘，点屏幕/按Enter推进 -->
<div id="introOverlay" onclick="introNext(event)">

    <div id="introDialog">

    <span class="intro-dot" data-i="1"></span>
    <span class="intro-dot" data-i="2"></span>
  </div>
</div>
<script>
/* ====== 开场剧情演出：在 main.init('play') 之前就能用，挂到 window.__intro ====== */
(function () {
  // 三段剧情：角色图 + 旁白
  // 图片使用缩放后的版本（项目自带），路径相对 index.html
  var STEPS = [
    {
      speaker: '大肥鱼',
      text: '好无聊啊……',
      img: 'project/images/intro/intro-1-bored.png'
    },
    {
      speaker: '大肥鱼',
      text: '偷偷吃一点 token，应该没事吧？',
      img: 'project/images/intro/intro-2-token.png'
    },
    {
      speaker: '大肥鱼',
      text: '来写个魔塔玩一下吧！',
      img: 'project/images/intro/intro-3-mota.png'
    }
  ];

  var overlay, charEl, textEl, speakerEl, hintEl, dots;
  var step = 0;
  var onDone = null;
  var busy = false; // 防止快速连点

  function $(id) { return document.getElementById(id); }

  function paint() {
    var s = STEPS[step];
    if (speakerEl) speakerEl.textContent = s.speaker;
    if (textEl) textEl.textContent = s.text;
    if (charEl) {
      // 强制重新触发动画
      charEl.style.animation = 'none';
      // 触发 reflow
      void charEl.offsetWidth;
      charEl.style.animation = '';
      charEl.src = s.img;
    }
    if (dots) {
      for (var i = 0; i < dots.length; i++) {
        if (i < step) dots[i].className = 'intro-dot';
        else if (i === step) dots[i].className = 'intro-dot active';
        else dots[i].className = 'intro-dot';
      }
    }
  }

  function finish() {
    if (overlay) {
      overlay.classList.remove('intro-show');
      // 等待淡出后再隐藏
      setTimeout(function () {
        if (overlay) overlay.style.display = 'none';
        step = 0;
        paint();
      }, 350);
    }
    var cb = onDone;
    onDone = null;
    if (typeof cb === 'function') {
      try { cb(); } catch (e) { console.error('[intro] done callback error:', e); }
    }
  }

  function advance() {
    if (busy) return;
    if (!overlay) return;
    if (overlay.style.display === 'none' || overlay.style.display === '') {
      // 还没开始，忽略
      return;
    }
    step++;
    if (step >= STEPS.length) {
      busy = true;
      finish();
    } else {
      paint();
    }
  }

  // 暴露给 inline onclick
  window.introNext = function (ev) {
    if (ev) {
      ev.stopPropagation();
    }
    advance();
  };

  // 键盘推进
  document.addEventListener('keydown', function (e) {
    if (!overlay || overlay.style.display === 'none') return;
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar' || e.keyCode === 13 || e.keyCode === 32) {
      e.preventDefault();
      advance();
    } else if (e.key === 'Escape' || e.keyCode === 27) {
      // Esc 也允许跳到下一段（不能跳过剧情）
      e.preventDefault();
      advance();
    }
  }, true);

  function play(callback) {
    overlay = $('introOverlay');
    charEl = $('introChar');
    textEl = $('introText');
    speakerEl = $('introSpeaker');
    hintEl = $('introHint');
    dots = overlay ? overlay.querySelectorAll('.intro-dot') : null;
    if (!overlay) {
      if (typeof callback === 'function') callback();
      return;
    }
    step = 0;
    onDone = callback || null;
    busy = false;
    paint();
    overlay.style.display = 'flex';
    // 强制 reflow 后加 class，触发过渡
    void overlay.offsetWidth;
    overlay.classList.add('intro-show');
  }

  // 预热（不显示），让首帧快
  function preload() {
    for (var i = 0; i < STEPS.length; i++) {
      var im = new Image();
      im.src = STEPS[i].img;
    }
  }

  window.__intro = { play: play, preload: preload };

  // DOM ready 后预热图片
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', preload);
  } else {
    preload();
  }
})();
</script>
<script>
(function(){
  var o=document.getElementById('cube-map-overlay');
  var iframe=null;
    function cubeMapOpen(){
    o.style.display='block';
    var curFloor=(window.core&&window.core.status&&window.core.status.floorId)?window.core.status.floorId:'MT0';
    if(!iframe){
      iframe=document.createElement('iframe');
      iframe.src='cube-map-viewer.html?floor='+encodeURIComponent(curFloor);
      iframe.style.cssText='width:100%;height:100%;border:none;';
      o.appendChild(iframe);
    } else {
      try{ iframe.contentWindow.postMessage({action:'refreshCubeMap',floor:curFloor},'*'); }catch(err){}
    }
  }
  function cubeMapClose(){o.style.display='none'}
  function cubeMapToggle(){
    if(o.style.display!=='none'){o.style.display='none';return}
    cubeMapOpen();
  }
  window.cubeMapOpen=cubeMapOpen;
  window.cubeMapClose=cubeMapClose;
  window.cubeMapToggle=cubeMapToggle;
  document.addEventListener('keydown',function(e){
    if(e.key!=='c'&&e.key!=='C')return;
    if(o.style.display!=='none'){o.style.display='none';e.preventDefault();e.stopPropagation();return}
    var c=window.core;
    if(!c||!c.isPlaying||!c.isPlaying())return;
    if(c.status&&c.status.lockControl)return;
    cubeMapOpen();
    e.preventDefault();e.stopPropagation()
  },true);
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'&&o.style.display!=='none'){o.style.display='none';e.preventDefault();e.stopPropagation()}
  });
  window.addEventListener('message',function(e){
    if(e.data&&e.data.action==='closeCubeMap')o.style.display='none'
  });
})();
</script>
